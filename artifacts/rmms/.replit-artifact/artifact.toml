kind = "web"
previewPath = "/"
title = "Rwanda Market Management System"
version = "1.0.0"
id = "artifacts/rmms"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19918

[services.development]
run = "pnpm --filter @workspace/rmms run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rmms", "run", "build" ]
publicDir = "artifacts/rmms/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19918"
BASE_PATH = "/"
